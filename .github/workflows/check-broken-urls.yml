name: Check Broken URLs

on:
  # Mondays and Wednesdays at 13:00 UTC
  schedule:
    - cron: '0 13 * * 1,3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-broken-urls:
    name: Check Broken URLs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install markdown-checker
        run: python -m pip install markdown-checker==1.2.2
      - name: Run Check Broken URLs
        run: >
          markdown-checker
          --dir ./
          --func check_broken_urls
          --timeout 10
          --retries 1
          --guide-url 'https://github.com/microsoft/generative-ai-for-beginners/blob/main/CONTRIBUTING.md'
      - name: Set job summary
        if: ${{ always() && hashFiles('./comment.md') != '' }}
        run: cat ./comment.md >> $GITHUB_STEP_SUMMARY
